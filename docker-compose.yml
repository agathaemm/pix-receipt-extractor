services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pix-receipt-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pix-receipt-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
